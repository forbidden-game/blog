{{ define "main" }}
<article class="page">
  <header class="page-head">
    <p class="eyebrow">{{ .Title | upper }}</p>
    <h1 data-cms-field="title">{{ .Title }}</h1>
    {{ with .Description }}<p data-cms-field="description">{{ . }}</p>{{ end }}
  </header>
  <div class="prose" data-cms-body>
    {{ .Content }}
  </div>
</article>
{{ end }}
