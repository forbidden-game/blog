<ol class="post-list">
  {{- range . }}
  <li>
    <a class="post-row" href="{{ .RelPermalink }}">
      <time class="post-row__date" datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2006.01.02" }}</time>
      <span class="post-row__title">{{ .Title }}</span>
      <span class="post-row__meta">
        {{- with .Params.kind }}{{ . | upper }}{{ end -}}
        {{- with .Params.tags }} · {{ delimit . " / " }}{{ end -}}
      </span>
    </a>
  </li>
  {{- end }}
</ol>
