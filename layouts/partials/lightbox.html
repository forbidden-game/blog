<dialog id="lightbox" class="lightbox" aria-label="图片查看器">
  <div class="lightbox__frame">
    <button class="lightbox__close" type="button" aria-label="关闭">[X]</button>
    <img class="lightbox__image" alt="" decoding="async">
    <p class="lightbox__caption"></p>
    <div class="lightbox__controls">
      <button type="button" data-prev aria-label="上一张">←</button>
      <span class="lightbox__count"></span>
      <button type="button" data-next aria-label="下一张">→</button>
    </div>
  </div>
</dialog>
